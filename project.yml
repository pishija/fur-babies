name: FurBabies

options:
  bundleIdPrefix: com.furbabies
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15"
  createIntermediateGroups: true
  groupSortPosition: top

packages:
  Firebase:
    url: https://github.com/firebase/firebase-ios-sdk
    from: "11.0.0"

targets:
  FurBabies:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - FurBabies
    info:
      path: FurBabies/Resources/Info.plist
      properties:
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        NSLocationWhenInUseUsageDescription: "FurBabies uses your location to show the live walk map and nearby pet-friendly places."
        NSLocationAlwaysAndWhenInUseUsageDescription: "FurBabies uses your location to track walks in the background."
        NSCameraUsageDescription: "FurBabies uses your camera to add photos of your dog."
        NSPhotoLibraryUsageDescription: "FurBabies accesses your photo library to add photos of your dog."
        NSPhotoLibraryAddUsageDescription: "FurBabies saves walk route snapshots to your photo library."
        CFBundleURLTypes:
          - CFBundleTypeRole: Editor
            CFBundleURLSchemes:
              - furbabies
    dependencies:
      - package: Firebase
        product: FirebaseAuth
      - package: Firebase
        product: FirebaseFirestore
      - package: Firebase
        product: FirebaseStorage
      - package: Firebase
        product: FirebaseMessaging
    settings:
      base:
        SWIFT_VERSION: 5.9
        PRODUCT_BUNDLE_IDENTIFIER: com.furbabies.app
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        CURRENT_PROJECT_VERSION: 1
        MARKETING_VERSION: 1.0.0
        SWIFT_STRICT_CONCURRENCY: targeted
